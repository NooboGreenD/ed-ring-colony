name: Auto Translate News & Galnet

# Резервный контур: догоняет очередь переводов для news и galnet_news.
# Основной перевод новых статей Galnet делает galnet-sync.yml (раз в сутки),
# этот workflow страхует его и переводит новости, добавленные админами вручную.
on:
  schedule:
    # Каждые 6 часов
    - cron: '40 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Сколько записей перевести за один проход'
        required: false
        default: '10'

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_YANDEX_KEY: ${{ secrets.YANDEX_TRANSLATE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm i @supabase/supabase-js --no-audit --no-fund

      # Основной путь: скрипт работает с БД напрямую.
      - name: Translate pending articles
        id: script
        if: ${{ env.HAS_YANDEX_KEY == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YANDEX_TRANSLATE_API_KEY: ${{ secrets.YANDEX_TRANSLATE_API_KEY }}
          YANDEX_TRANSLATE_FOLDER_ID: ${{ secrets.YANDEX_TRANSLATE_FOLDER_ID }}
          YANDEX_TRANSLATE_IAM_TOKEN: ${{ secrets.YANDEX_TRANSLATE_IAM_TOKEN }}
        run: |
          set +e
          node scripts/galnet-sync.mjs --translate-only --translate-limit=${{ github.event.inputs.limit || '10' }} --json > translate.json
          status=$?
          set -e
          cat translate.json
          {
            echo "### Auto translate"
            echo '```json'
            cat translate.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Резерв: ключ Yandex настроен только в Vercel — перевод делает сайт.
      - name: Translate via Vercel (fallback when no Yandex key in Actions)
        if: ${{ env.HAS_YANDEX_KEY != 'true' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          url="${{ secrets.VERCEL_URL || 'https://ed-ring-colony.vercel.app' }}/api/cron/translate?limit=${{ github.event.inputs.limit || '10' }}"
          code=$(curl -s -o translate.json -w "%{http_code}" \
            --max-time 120 --retry 2 --retry-delay 5 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$url")
          echo "HTTP ${code}"
          cat translate.json
          echo
          {
            echo "### Auto translate (via Vercel)"
            echo '```json'
            cat translate.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "200" ]; then
            echo "::error::Vercel translate endpoint returned HTTP ${code}"
            exit 1
          fi
