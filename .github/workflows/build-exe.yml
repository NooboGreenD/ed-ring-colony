name: Build Colonial Helper EXE

on:
  push:
    branches:
      - main
      # Все рабочие ветки агента/сессий собирают EXE и публикуют его
      # в Releases: main — полноценным релизом, arena/** — prerelease
      # с суффиксом ветки в теге (иначе ветки перезаписывали бы друг друга).
      - arena/**
    # Сборка запускается ТОЛЬКО когда в push есть правки самой программы.
    # Пуши, которые трогают лишь сайт (src/**, supabase/**, deploy/**, доки),
    # не должны гонять 10-минутный Windows-раннер и, что важнее, публиковать
    # новый релиз с тем же EXE: у пользователей это выглядит как обновление,
    # в котором ничего не изменилось.
    #
    # Сам workflow в списке намеренно: правка правил сборки обязана
    # проверяться сборкой. Если нужно собрать EXE без изменений в uploader/ —
    # ручной запуск (workflow_dispatch) фильтром путей не ограничен.
    paths:
      - 'uploader/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Deprecated: релиз теперь публикуется при каждом push"
        required: false
        default: true
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Вывод тестов и служебных скриптов на русском: без UTF-8 консоль
      # раннера (cp1252/cp850) роняет print с UnicodeEncodeError.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r uploader/requirements.txt

      - name: Validate uploader sources
        run: |
          python -m py_compile uploader/colonial_helper.py uploader/overlay.py uploader/api_client.py uploader/site_config.py uploader/journal_parser.py uploader/event_dispatch.py uploader/edsm_api.py uploader/inara_api.py uploader/raven_colonial_api.py uploader/game_monitor.py uploader/exobiology.py uploader/hotkeys.py uploader/colonisation.py uploader/carrier.py uploader/updater.py uploader/http_errors.py uploader/system_map.py uploader/orrery.py uploader/system_view.py uploader/map_export.py uploader/map_font.py

      - name: Run uploader tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s uploader/tests -v 2>&1 | tee uploader-tests.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "=================== TEST FAILURE TAIL ==================="
            tail -n 150 uploader-tests.log
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              summary_path=$(cygpath -u "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "$GITHUB_STEP_SUMMARY")
              echo "## Упавшие тесты (хвост прогона)" >> "$summary_path"
              tail -n 150 uploader-tests.log >> "$summary_path"
            fi
          fi
          exit "$code"

      # Версия берётся из colonial_helper.VERSION, тег и признак prerelease —
      # из имени ветки. Считает это uploader/updater.py, чтобы правила тегов
      # были покрыты тестами, а не жили в YAML.
      - name: Prepare release metadata
        id: meta
        shell: pwsh
        run: |
          $version = (python uploader/updater.py --version).Trim()
          $branch = "$env:GITHUB_REF_NAME"
          if (-not $version) { throw "Не удалось прочитать VERSION из colonial_helper.py" }
          if ($branch -eq "main") {
            $prerelease = "false"
            $title = "Colonial Helper $version"
          } else {
            $prerelease = "true"
            $title = "Colonial Helper $version ($branch)"
          }
          $tag = (python uploader/updater.py --tag --branch $branch).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version tag=$tag prerelease=$prerelease title=$title"

      - name: Build release notes
        shell: pwsh
        run: |
          # Пишем файл из Python (--notes-file, UTF-8): вывод через pipe
          # шёл в кодировке консоли и русский ченджлог падал.
          python uploader/updater.py --notes-file release-notes.md --branch "$env:GITHUB_REF_NAME" --commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Не удалось собрать описание релиза" }
          Get-Content release-notes.md -TotalCount 5

      - name: Build EXE with PyInstaller
        run: |
          cd uploader
          python build_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColonialHelper-Windows
          path: uploader/dist/ColonialHelper.exe

      # Релиз публикуется при каждом push: тег уже существует — релиз
      # обновляется (softprops/action-gh-release создаёт или перезаписывает).
      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          # Без этого релиз помечается веткой по умолчанию (main), даже если
          # собран из arena/** — в списке релизов видно не ту ветку.
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: uploader/dist/ColonialHelper.exe
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
