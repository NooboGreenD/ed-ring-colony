name: Build Colonial Helper EXE

on:
  push:
    branches:
      - main
      # Базовая сборка (лаунчер) — это Python, tkinter, ttkbootstrap и requests.
      # Код программы в неё больше не «впаян»: он едет пакетом с нашего сервера
      # (см. build-bundle.yml). Поэтому exe пересобирается ТОЛЬКО когда меняется
      # рантайм или сам механизм запуска — иначе пилоты снова получали бы
      # 22-мегабайтное «обновление», в котором для них ничего не изменилось.
      - arena/**
    paths:
      - 'uploader/requirements.txt'
      - 'uploader/launcher.py'
      - 'uploader/build_exe.py'
      - 'uploader/build_bundle.py'
      - 'uploader/bundle.py'
      - 'uploader/bundle_updater.py'
      - 'uploader/site_config.py'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Deprecated: релиз публикуется при каждом запуске"
        required: false
        default: true
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Вывод тестов и служебных скриптов на русском: без UTF-8 консоль
      # раннера (cp1252/cp850) роняет print с UnicodeEncodeError.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      # Пакет, вшитый в exe для первого запуска, подписывается тем же ключом,
      # что и обычные обновления: иначе лаунчер не сможет проверить ни его,
      # ни то, что приедет следом по сети.
      UPLOADER_SIGN_KEY: ${{ secrets.UPLOADER_SIGN_KEY }}
      UPLOADER_SIGN_KEY_ID: ${{ secrets.UPLOADER_SIGN_KEY_ID }}
      UPLOADER_PUBLISH_URL: ${{ secrets.UPLOADER_PUBLISH_URL }}
      UPLOADER_PUBLISH_TOKEN: ${{ secrets.UPLOADER_PUBLISH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r uploader/requirements.txt

      - name: Validate uploader sources
        shell: bash
        run: |
          # Список модулей берём с диска: при ручном перечислении новый файл
          # годами не попадал в проверку.
          python -m py_compile uploader/*.py

      - name: Run uploader tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s uploader/tests -v 2>&1 | tee uploader-tests.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "=================== TEST FAILURE TAIL ==================="
            tail -n 150 uploader-tests.log
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              summary_path=$(cygpath -u "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "$GITHUB_STEP_SUMMARY")
              echo "## Упавшие тесты (хвост прогона)" >> "$summary_path"
              tail -n 150 uploader-tests.log >> "$summary_path"
            fi
          fi
          exit "$code"

      # Версия берётся из colonial_helper.VERSION, тег и признак prerelease —
      # из имени ветки. Считает это uploader/updater.py, чтобы правила тегов
      # были покрыты тестами, а не жили в YAML.
      - name: Prepare release metadata
        id: meta
        shell: pwsh
        run: |
          $version = (python uploader/updater.py --version).Trim()
          $branch = "$env:GITHUB_REF_NAME"
          if (-not $version) { throw "Не удалось прочитать VERSION из colonial_helper.py" }
          if ($branch -eq "main") {
            $prerelease = "false"
            $title = "Colonial Helper $version"
          } else {
            $prerelease = "true"
            $title = "Colonial Helper $version ($branch)"
          }
          $tag = (python uploader/updater.py --tag --branch $branch).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version tag=$tag prerelease=$prerelease title=$title"

      - name: Build release notes
        shell: pwsh
        run: |
          # Пишем файл из Python (--notes-file, UTF-8): вывод через pipe
          # шёл в кодировке консоли и русский ченджлог падал.
          python uploader/updater.py --notes-file release-notes.md --branch "$env:GITHUB_REF_NAME" --commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Не удалось собрать описание релиза" }
          Get-Content release-notes.md -TotalCount 5

      - name: Build EXE with PyInstaller
        run: |
          cd uploader
          python build_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColonialHelper-Windows
          path: uploader/dist/ColonialHelper.exe

      # Релиз публикуется при каждом push: тег уже существует — релиз
      # обновляется (softprops/action-gh-release создаёт или перезаписывает).
      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          # Без этого релиз помечается веткой по умолчанию (main), даже если
          # собран из arena/** — в списке релизов видно не ту ветку.
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: uploader/dist/ColonialHelper.exe
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Сервер должен знать, где лежит новая базовая сборка и какой у неё
      # хеш: программа спрашивает это, когда пакет требует min_launcher выше
      # установленного.
      - name: Publish launcher metadata
        if: ${{ env.UPLOADER_PUBLISH_URL != '' && env.UPLOADER_PUBLISH_TOKEN != '' }}
        shell: bash
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.meta.outputs.tag }}/ColonialHelper.exe"
          python uploader/build_bundle.py \
            --publish-launcher uploader/dist/ColonialHelper.exe \
            --launcher-url "$url"
