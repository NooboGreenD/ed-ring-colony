name: Build Colonial Helper EXE

on:
  push:
    branches:
      - main
      # Все рабочие ветки агента/сессий собирают EXE и публикуют его
      # в Releases: main — полноценным релизом, arena/** — prerelease
      # с суффиксом ветки в теге (иначе ветки перезаписывали бы друг друга).
      - arena/**
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Deprecated: релиз теперь публикуется при каждом push"
        required: false
        default: true
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r uploader/requirements.txt

      - name: Validate uploader sources
        run: |
          python -m py_compile uploader/colonial_helper.py uploader/overlay.py uploader/api_client.py uploader/journal_parser.py uploader/event_dispatch.py uploader/edsm_api.py uploader/inara_api.py uploader/raven_colonial_api.py uploader/game_monitor.py uploader/exobiology.py uploader/hotkeys.py uploader/colonisation.py uploader/carrier.py uploader/updater.py

      - name: Run uploader tests
        run: |
          python -m unittest discover -s uploader/tests -v

      # Версия берётся из colonial_helper.VERSION, тег и признак prerelease —
      # из имени ветки. Считает это uploader/updater.py, чтобы правила тегов
      # были покрыты тестами, а не жили в YAML.
      - name: Prepare release metadata
        id: meta
        shell: pwsh
        run: |
          $version = (python uploader/updater.py --version).Trim()
          $branch = "$env:GITHUB_REF_NAME"
          if (-not $version) { throw "Не удалось прочитать VERSION из colonial_helper.py" }
          if ($branch -eq "main") {
            $prerelease = "false"
            $title = "Colonial Helper $version"
          } else {
            $prerelease = "true"
            $title = "Colonial Helper $version ($branch)"
          }
          $tag = (python uploader/updater.py --tag --branch $branch).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version tag=$tag prerelease=$prerelease title=$title"

      - name: Build release notes
        shell: pwsh
        run: |
          python uploader/updater.py --notes --branch "$env:GITHUB_REF_NAME" --commit "$env:GITHUB_SHA" |
            Out-File -FilePath release-notes.md -Encoding utf8

      - name: Build EXE with PyInstaller
        run: |
          cd uploader
          python build_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColonialHelper-Windows
          path: uploader/dist/ColonialHelper.exe

      # Релиз публикуется при каждом push: тег уже существует — релиз
      # обновляется (softprops/action-gh-release создаёт или перезаписывает).
      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: release-notes.md
          files: uploader/dist/ColonialHelper.exe
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
