name: Build Colonial Helper EXE

on:
  push:
    branches:
      - main
      # Все рабочие ветки агента/сессий собирают EXE и выкладывают его
      # артефактом прогона. Конкретную ветку можно запустить и вручную
      # (workflow_dispatch) с флагом upload_release.
      - arena/**
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Upload the EXE to the latest Colonial Helper release"
        required: false
        default: false
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r uploader/requirements.txt

      - name: Validate uploader sources
        run: |
          python -m py_compile uploader/colonial_helper.py uploader/overlay.py uploader/api_client.py uploader/journal_parser.py uploader/event_dispatch.py uploader/edsm_api.py uploader/inara_api.py uploader/raven_colonial_api.py uploader/game_monitor.py uploader/exobiology.py uploader/hotkeys.py

      - name: Run uploader tests
        run: |
          set +e
          python -m unittest discover -s uploader/tests -v > tests.log 2>&1
          code=$?
          tail -n 60 tests.log
          if [ "$code" -ne 0 ]; then
            git config user.email "ci-bot@users.noreply.github.com"
            git config user.name "ci-bot"
            git add -f tests.log
            git commit -m "ci-debug: лог упавших тестов ($GITHUB_RUN_ID)" || true
            git push origin "HEAD:$GITHUB_REF_NAME" || true
          fi
          exit $code

      - name: Build EXE with PyInstaller
        run: |
          cd uploader
          python build_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColonialHelper-Windows
          path: uploader/dist/ColonialHelper.exe

      - name: Upload to Release
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.upload_release == true)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: colonial-helper-latest
          name: "Colonial Helper (Latest Build)"
          body: "Автоматическая сборка ColonialHelper.exe"
          files: uploader/dist/ColonialHelper.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
