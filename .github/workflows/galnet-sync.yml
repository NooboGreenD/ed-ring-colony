name: Galnet Sync

# Расписание: один раз в сутки в 06:20 UTC (09:20 МСК).
# Frontier публикует Galnet пачками, суточного цикла достаточно.
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Сколько последних статей забрать из ленты'
        required: false
        default: '30'
      translate_limit:
        description: 'Сколько статей перевести за один проход'
        required: false
        default: '10'
      skip_translate:
        description: 'Только синхронизация, без перевода (true/false)'
        required: false
        default: 'false'
  pull_request:
    paths:
      - 'scripts/**'
      - 'src/app/api/galnet/**'
      - 'src/app/api/cron/translate/**'
      - 'src/lib/translate.ts'
      - '.github/workflows/galnet-sync.yml'

jobs:
  # ── Проверка парсера ───────────────────────────────────────────────────
  # Ловит поломку контракта API / парсера до того, как она попадёт в прод.
  parser-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parser unit tests
        run: node --test scripts/tests/*.test.mjs
      - name: Live feed dry-run (parse only, no DB writes)
        run: |
          set +e
          node scripts/galnet-sync.mjs --dry-run --limit=10 --json > dry-run.json
          code=$?
          set -e
          cat dry-run.json
          if [ "$code" -eq 0 ]; then exit 0; fi
          # Проблема сети/доступа к ленте не должна блокировать PR,
          # а вот реальная поломка парсера — должна.
          if node -e "const d=require('./dry-run.json'); const e=d.error||''; process.exit(/HTTP \\d|timed out|fetch failed|ENOTFOUND|EAI_AGAIN|ECONN|ECONNRESET|socket|TLS/i.test(e) ? 0 : 1)"; then
            echo "::warning::Galnet feed is unreachable from CI (network/access); parser not verified live."
            exit 0
          fi
          echo "::error::Galnet parser smoke test failed"
          exit 1

  # ── Ежедневная синхронизация + автоперевод ────────────────────────────
  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Признак наличия ключа Yandex в секретах Actions (булево как строка).
      HAS_YANDEX_KEY: ${{ secrets.YANDEX_TRANSLATE_API_KEY != '' }}
      SITE_URL: ${{ secrets.VERCEL_URL || 'https://ed-ring-colony.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm i @supabase/supabase-js --no-audit --no-fund

      - name: Sync Galnet feed and translate new articles
        id: sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YANDEX_TRANSLATE_API_KEY: ${{ secrets.YANDEX_TRANSLATE_API_KEY }}
          YANDEX_TRANSLATE_FOLDER_ID: ${{ secrets.YANDEX_TRANSLATE_FOLDER_ID }}
          YANDEX_TRANSLATE_IAM_TOKEN: ${{ secrets.YANDEX_TRANSLATE_IAM_TOKEN }}
          GALNET_FEED_LIMIT: ${{ github.event.inputs.limit || '30' }}
          GALNET_TRANSLATE_LIMIT: ${{ github.event.inputs.translate_limit || '10' }}
        run: |
          args="--json"
          if [ "${{ github.event.inputs.skip_translate }}" = "true" ]; then
            args="$args --no-translate"
          fi
          set +e
          node scripts/galnet-sync.mjs $args > galnet-sync.json
          status=$?
          set -e
          cat galnet-sync.json
          if [ "$status" -ne 0 ]; then
            echo "::error::galnet-sync finished with exit code $status"
            exit "$status"
          fi

      # Резерв: если раннер не смог дотянуться до ленты Frontier
      # (блокировка по IP, сеть) — синхронизацию выполняет сам сайт.
      - name: Sync via Vercel (fallback when script fails)
        if: failure() && steps.sync.outcome == 'failure'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o galnet-sync.json -w "%{http_code}" \
            --max-time 280 --retry 2 --retry-delay 10 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${SITE_URL}/api/galnet")
          echo "HTTP ${code}"
          cat galnet-sync.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::/api/galnet returned HTTP ${code}"
            exit 1
          fi

      - name: Drain remaining translation queue
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YANDEX_TRANSLATE_API_KEY: ${{ secrets.YANDEX_TRANSLATE_API_KEY }}
          YANDEX_TRANSLATE_FOLDER_ID: ${{ secrets.YANDEX_TRANSLATE_FOLDER_ID }}
          YANDEX_TRANSLATE_IAM_TOKEN: ${{ secrets.YANDEX_TRANSLATE_IAM_TOKEN }}
        run: |
          # Если новых статей было больше, чем влезло в один проход,
          # догоняем остаток ещё несколькими вызовами.
          for attempt in 1 2 3 4; do
            echo "--- drain attempt ${attempt} ---"
            set +e
            node scripts/galnet-sync.mjs --translate-only --translate-limit=10 --json > "drain-${attempt}.json"
            status=$?
            set -e
            cat "drain-${attempt}.json"
            if [ "$status" -ne 0 ]; then
              echo "::warning::translation drain reported errors on attempt ${attempt}"
              break
            fi
            remaining=$(node -e "const d=require('./drain-${attempt}.json'); process.stdout.write(String(d.remaining || 0))")
            echo "remaining in queue: ${remaining}"
            if [ "$remaining" = "0" ]; then break; fi
          done

      # Если ключ Yandex не лежит в секретах Actions (он настроен только в Vercel),
      # перевод выполняет сам сайт — у него есть и ключ, и доступ к БД.
      - name: Translate via Vercel (fallback when no Yandex key in Actions)
        if: ${{ env.HAS_YANDEX_KEY != 'true' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o translate-fallback.json -w "%{http_code}" \
            --max-time 280 --retry 2 --retry-delay 10 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/translate?limit=10")
          echo "HTTP ${code}"
          cat translate-fallback.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::/api/cron/translate returned HTTP ${code}"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Galnet sync"
            echo
            if [ -f galnet-sync.json ]; then
              echo '```json'
              cat galnet-sync.json
              echo '```'
            else
              echo "No sync report produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
