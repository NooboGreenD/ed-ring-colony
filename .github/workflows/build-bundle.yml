name: Publish Colonial Helper bundle

# Обычный релиз программы теперь выглядит так: собрать пакет кода (27 модулей,
# ~400 КиБ в архиве), подписать его и положить на наш сервер. Пилоту приедут
# только изменившиеся файлы — 5–130 КиБ вместо 22-мегабайтного exe.
#
# Поэтому этот workflow быстрый (ubuntu, ~30 секунд) и срабатывает на любую
# правку программы. Тяжёлая сборка на Windows-раннере (build-exe.yml) осталась
# только для смены рантайма: новая библиотека, другой Python, правка лаунчера.

on:
  push:
    branches:
      - main
      - arena/**
    paths:
      - 'uploader/**'
      - '.github/workflows/build-bundle.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: "Канал публикации (stable | beta); по умолчанию — по ветке"
        required: false
        default: ''
        type: string

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      # Ключ подписи и адрес публикации. Пока секреты не заданы, пакет всё
      # равно собирается и лежит артефактом — просто не уезжает на сервер.
      UPLOADER_SIGN_KEY: ${{ secrets.UPLOADER_SIGN_KEY }}
      UPLOADER_SIGN_KEY_ID: ${{ secrets.UPLOADER_SIGN_KEY_ID }}
      UPLOADER_PUBLISH_URL: ${{ secrets.UPLOADER_PUBLISH_URL }}
      UPLOADER_PUBLISH_TOKEN: ${{ secrets.UPLOADER_PUBLISH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # PyInstaller здесь не нужен: exe не собираем. Ставим только то, что
        # импортируют тесты, иначе минутная установка съедает весь выигрыш.
        run: |
          python -m pip install --upgrade pip
          grep -v -i 'pyinstaller' uploader/requirements.txt > /tmp/bundle-requirements.txt
          pip install -r /tmp/bundle-requirements.txt

      - name: Validate uploader sources
        run: |
          python - <<'PY'
          import pathlib, py_compile, sys
          problems = []
          for path in sorted(pathlib.Path('uploader').glob('*.py')):
              try:
                  py_compile.compile(str(path), doraise=True)
              except py_compile.PyCompileError as exc:
                  problems.append(str(exc))
          if problems:
              print('\n'.join(problems))
              sys.exit(1)
          print('Синтаксис в порядке')
          PY

      - name: Run uploader tests
        run: python -m unittest discover -s uploader/tests

      - name: Release notes
        run: |
          python uploader/updater.py --notes-file release-notes.md \
            --branch "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}"

      - name: Build and sign bundle
        run: |
          python uploader/build_bundle.py \
            --out dist/bundle \
            --branch "${GITHUB_REF_NAME}" \
            --channel "${{ github.event.inputs.channel }}" \
            --notes-file release-notes.md
          python - <<'PY'
          import json, pathlib
          manifest = json.loads(pathlib.Path('dist/bundle/manifest.json').read_text('utf-8'))
          if not manifest.get('signature'):
              print('::warning::Пакет не подписан — задайте секрет UPLOADER_SIGN_KEY, '
                    'иначе клиенты его не поставят')
          print(f"version={manifest['version']} channel={manifest['channel']}")
          PY

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColonialHelper-bundle
          path: |
            dist/bundle/manifest.json
            dist/bundle/*.zip

      # Публикуется РОВНО тот пакет, что собран выше: пересборка дала бы другой
      # `released_at`, другую подпись — и артефакт CI перестал бы совпадать с
      # тем, что уехало пилотам.
      - name: Publish to server
        if: ${{ env.UPLOADER_PUBLISH_URL != '' && env.UPLOADER_PUBLISH_TOKEN != '' }}
        run: python uploader/build_bundle.py --out dist/bundle --publish-existing

      - name: Skip notice
        if: ${{ env.UPLOADER_PUBLISH_URL == '' || env.UPLOADER_PUBLISH_TOKEN == '' }}
        run: |
          echo "::notice::Канал обновлений не настроен: задайте секреты " \
               "UPLOADER_PUBLISH_URL и UPLOADER_PUBLISH_TOKEN (см. UPLOADER-UPDATE-STRUCTURE.md)."

      - name: Summary
        run: |
          python - <<'PY'
          import json, os, pathlib
          manifest = json.loads(pathlib.Path('dist/bundle/manifest.json').read_text('utf-8'))
          size = sum(int(f['size']) for f in manifest['files'])
          archive = next(pathlib.Path('dist/bundle').glob('*.zip'))
          lines = [
              '## Пакет кода Colonial Helper',
              '',
              f"* Версия: **{manifest['version']}**, канал **{manifest['channel']}**",
              f"* Файлов: {len(manifest['files'])}, исходников {size/1024:.0f} КиБ, "
              f"архив {archive.stat().st_size/1024:.0f} КиБ",
              f"* Подпись: {'есть' if manifest.get('signature') else 'НЕТ'}",
              f"* Минимальный лаунчер: {manifest.get('min_launcher')}",
              '',
              'Пилоты получат только изменившиеся файлы — exe перекачивать не нужно.',
          ]
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              pathlib.Path(summary).write_text('\n'.join(lines), encoding='utf-8')
          print('\n'.join(lines))
          PY
