# Merge INSIDE the EXISTING HTTPS server for supabase.edringcolony.ru.
# Do not replace the server block, certificates or other Supabase routes.
# Keep existing access controls/proxy headers when adapting a custom deployment.
# Host nginx: use Kong's ACTUAL published HTTP port (see realtime-check.py).
# Docker nginx: use the Kong service on the shared network, not 127.0.0.1.
location ^~ /realtime/v1/ {
    # No URI suffix / trailing slash here: Kong must receive /realtime/v1/...
    # Kong itself rewrites it to /socket/... in Realtime.
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
    # apikey is present in the WebSocket URL. Never include it in access logs.
    access_log off;
}
