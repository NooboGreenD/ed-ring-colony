# ED Ring Colony — nginx для схемы «всё на одной машине»
# (сайт + self-hosted Supabase на одном сервере со статическим IP).
#
# Маршрутизация:
#   :80  → сайт (Next.js standalone на 127.0.0.1:3000)
#   :8000 (публикует Kong из docker compose Supabase) — API Supabase:
#          браузер ходит на него НАПРЯМУЮ, nginx его не трогает.
#          Если есть домен и TLS — вместо этого используйте вариант
#          с сабдоменом ниже (supabase.ваш-домен).
#
# Установка:
#   sudo cp deploy/selfhost/nginx-selfhost.conf /etc/nginx/sites-available/ed-ring-colony
#   sudo ln -s /etc/nginx/sites-available/ed-ring-colony /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Со статическим IP без домена server_name не важен:
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Долгие роуты (/api/atlas/ring-route считает до 5 минут)
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Загрузка журналов пилотов
    client_max_body_size 25m;

    # Админка → «Публикация Helper»: готовый ColonialHelper.exe (обычно
    # 22–35 МиБ) грузится прямо на сервер через этот endpoint — иначе nginx
    # отвечает 413 ещё до приложения. Если TLS завершается в отдельном server
    # (listen 443), этот location нужно продублировать именно в HTTPS server:
    # настройки location не переходят между server-блоками.
    location = /api/admin/uploader/release {
        # 200m — с запасом перекрывает и exe (22–35 МиБ), и multipart-обёртку.
        # Приложение само отклоняет базовую сборку крупнее 128 МиБ, поэтому
        # лимит location обязан быть выше: иначе 413 отвечает nginx, а не сайт.
        client_max_body_size 200m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

