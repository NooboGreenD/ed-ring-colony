# ED Ring Colony — пример конфигурации nginx для VPS
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ed-ring-colony
#   sudo ln -s /etc/nginx/sites-available/ed-ring-colony /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS-сертификат (после того, как DNS указывает на сервер):
#   sudo certbot --nginx -d your-domain.example
#   (certbot сам допишет ssl_certificate/listen 443 в этот файл)

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;   # ← замените на свой домен

    # ── Размер заголовков ───────────────────────────────────────────────
    # Сессия Supabase лежит в cookie `sb-edrc-auth-token` и режется на куски
    # по 3180 символов; в куске — весь объект сессии вместе со списком
    # привязанных провайдеров. У пилота с Discord+Google+VK+Yandex заголовок
    # Cookie переваливает за 8 КиБ, а это ровно предел nginx по умолчанию
    # (`large_client_header_buffers 4 8k`): сервер отвечает 400 «Request Header
    # Or Cookie Too Large» и сайт не открывается вовсе (в инкогнито — да,
    # потому что cookies там нет). 32k с запасом перекрывает живую сессию;
    # приложение вдобавок подчищает мёртвые куски и сбрасывает совсем
    # разросшийся набор (src/lib/cookieBudget.ts).
    client_header_buffer_size 8k;
    large_client_header_buffers 8 32k;

    # Next.js standalone-сервер (docker compose или pm2/systemd)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/долгие запросы (роут /api/atlas/ring-route считает до 5 минут)
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;

        # WebSocket-заголовки (на будущее, не мешают обычным запросам)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Загрузка журналов пилотов бывает крупной
    client_max_body_size 25m;

    # Старая админка загружала EXE (обычно 22–35 МиБ) одним multipart-запросом.
    # Текущая отправляет raw-части до 4 МиБ и при 413 уменьшает их до 1 МиБ;
    # 200m оставлен для обратной совместимости. TLS-location дублируется в
    # отдельный HTTPS server: nginx не наследует locations между server-блоками.
    location = /api/admin/uploader/release {
        # 200m перекрывает EXE старых клиентов (22–35 МиБ) и multipart-обёртку.
        # Приложение само отклоняет базовую сборку крупнее 128 МиБ, поэтому
        # лимит location обязан быть выше: иначе 413 отвечает nginx, а не сайт.
        client_max_body_size 200m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Кэш неизменяемой статики Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Запрет публичного доступа к Supabase Studio и pg-meta через туннель /api/supabase
    location = /api/supabase { return 404; }
    location = /api/supabase/ { return 404; }
    location ^~ /api/supabase/project/ { return 404; }
    location ^~ /api/supabase/api/pg-meta/ { return 404; }

    # Отключение логирования query-параметров для legacy-запросов CAPI-токена
    location = /api/capi/token {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Канал обновлений Colonial Helper: файлы пакета адресуются по sha256,
    # то есть содержимое и имя — одно и то же. Такой ответ можно кэшировать
    # вечно: один и тот же модуль не поедет по сети дважды, даже если он есть
    # в десяти версиях подряд. Cache-Control ставит само приложение, здесь —
    # только запас по времени на скачивание с медленного канала.
    location ~ ^/api/uploader/(blob|bundle)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# TLS вручную (не через `certbot --nginx`, который копирует locations сам)?
# Тогда locations из блока выше в `listen 443` не переедут. Актуальная админка
# отправляет EXE частями до 4 МиБ (с автоповтором до 1 МиБ), но этот location
# всё равно повторите в HTTPS-блоке для старых клиентов с цельным multipart:
#
