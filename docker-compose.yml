# ED Ring Colony — docker compose для VPS
#
#   1. cp .env.example .env.production и заполните значения
#   2. docker compose --env-file .env.production up -d --build
#
# Веб-приложение слушает 127.0.0.1:3000 — наружу его отдаёт nginx/caddy
# (см. deploy/nginx.conf). Если reverse-proxy не нужен, поменяйте
# "127.0.0.1:3000:3000" на "3000:3000".

services:
  web:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* вшиваются в бандл на этапе сборки
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        # Non-secret deployment metadata for the protected status dashboard.
        # The shell values below can be filled automatically before a deploy;
        # "unknown" is safe when a legacy deployment has no build metadata.
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_GIT_REF: ${APP_GIT_REF:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
        # 0 — пропустить npm test внутри образа (экстренный быстрый режим).
        RUN_TESTS: ${RUN_TESTS:-1}
    env_file:
      - .env.production
    environment:
      # The agent has no published port and is queried only after admin auth.
      MONITOR_AGENT_URL: http://monitor-agent:8080
      MONITOR_AGENT_TOKEN: ${MONITOR_AGENT_TOKEN:-}
      # Manual project update: the private update-agent (profile `monitoring`)
      # is the only process allowed to run git and Docker. `web` forwards an
      # admin-confirmed request to it with a separate Bearer token.
      # A non-Docker (systemd) install uses http://127.0.0.1:8092 instead.
      UPDATE_AGENT_URL: ${UPDATE_AGENT_URL:-http://update-agent:8092}
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:-}
      PROJECT_REPOSITORY: ${PROJECT_REPOSITORY:-NooboGreenD/ed-ring-colony}
      PROJECT_UPDATE_BRANCH: ${PROJECT_UPDATE_BRANCH:-main}
      PROJECT_DEPLOY_MODE: ${PROJECT_DEPLOY_MODE:-auto}
    # Lets a host-run updater (deploy/ed-ring-colony-update.service) be reached
    # without publishing its port; harmless when the agent runs as a container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Pre-downloaded Spansh dump (~6 GiB). The web process downloads it here
      # (resumable) and imports from disk, so a dropped connection never costs
      # a full re-download and the archive survives image rebuilds. Override
      # GALAXY_ARCHIVE_DIR to point the import elsewhere.
      - galaxy-dump:/app/data/spansh
    # The private monitor network prevents the privileged agent from sharing
    # the default service network with other containers.
    networks:
      - default
      - monitor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # All six former Actions jobs, on the server. Exactly ONE scheduler instance.
  # No public ports; requests use the Docker network, bypassing public nginx/TLS.
  jobs:
    build:
      context: .
      dockerfile: deploy/Dockerfile.jobs
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env.production and pass --env-file .env.production}
      JOBS_BASE_URL: http://web:3000
      JOBS_STATE_FILE: /data/jobs-state.json
      # `galaxy-import` (ночной дамп Spansh → galaxy_systems) не входит в
      # список по умолчанию: добавьте его в JOBS_ENABLED осознанно.
      JOBS_ENABLED: ${JOBS_ENABLED-capi-sync,update-progress,cg-check,eddn-cleanup,galnet-sync,translate}
      GALNET_FEED_LIMIT: ${GALNET_FEED_LIMIT:-30}
      GALNET_TRANSLATE_LIMIT: ${GALNET_TRANSLATE_LIMIT:-10}
      JOBS_TRANSLATE_PASSES: ${JOBS_TRANSLATE_PASSES:-4}
    volumes:
      - jobs-state:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Private read-only operations agent. It is the *only* service that sees
  # Docker's Unix socket; `web` gets a sanitised status response over the
  # internal Compose network after application-level admin authorization.
  # No host port is published. Leave MONITOR_AGENT_TOKEN empty only when the
  # dashboard is intentionally disabled; the public site keeps working.
  monitor-agent:
    # Opt-in because Docker's socket is privileged even when mounted :ro.
    # Start it with: docker compose --profile monitoring up -d monitor-agent
    profiles: ["monitoring"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.monitor
    environment:
      MONITOR_AGENT_TOKEN: ${MONITOR_AGENT_TOKEN:-}
      # Usually inferred from this container's Compose label; this is a
      # fallback for installations with a custom container hostname.
      MONITOR_COMPOSE_PROJECT: ${MONITOR_COMPOSE_PROJECT:-ed-ring-colony}
      MONITOR_SERVICES: web,jobs,monitor-agent
      # Preserve JOBS_ENABLED semantics: a missing value uses the normal list,
      # an explicitly empty value means no scheduler tasks are enabled.
      MONITOR_JOBS_ENABLED: ${JOBS_ENABLED-capi-sync,update-progress,cg-check,eddn-cleanup,galnet-sync,translate}
      MONITOR_JOBS_STATE_FILE: /monitor/jobs-state/jobs-state.json
      # Опциональный прямой read-only замер размера БД (pg_database_size).
      # Зеркалируется из DATABASE_URL/SUPABASE_DB_URL скриптом start-monitoring.sh:
      # web-контейнер не всегда видит Postgres напрямую, а агент — да.
      MONITOR_DB_URL: ${MONITOR_DB_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - jobs-state:/monitor/jobs-state:ro
    networks:
      - monitor
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Privileged by design: the only container allowed to change what runs.
  # It gets the Docker socket (read-write: it recreates services) and the repo
  # mounted at the SAME host path, because the daemon resolves build contexts
  # on the host. Never published on a host port; reachable only from the
  # Compose network and only with UPDATE_AGENT_TOKEN.
  update-agent:
    profiles: ["monitoring"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.update-agent
    environment:
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:-}
      UPDATE_AGENT_PORT: 8092
      PROJECT_DIR: ${PROJECT_HOST_DIR:-/opt/ed-ring-colony/src}
      PROJECT_REPOSITORY: ${PROJECT_REPOSITORY:-NooboGreenD/ed-ring-colony}
      PROJECT_UPDATE_BRANCH: ${PROJECT_UPDATE_BRANCH:-main}
      PROJECT_DEPLOY_MODE: ${PROJECT_DEPLOY_MODE-compose}
      UPDATE_APPLY_MIGRATIONS: ${UPDATE_APPLY_MIGRATIONS:-1}
      UPDATE_STATE_DIR: /state
      UPDATE_HEALTH_URL: http://web:3000/api/health
      # pg_dump/pg_restore inside the updater talk to the self-hosted stack.
      SUPABASE_CONTAINER: ${SUPABASE_CONTAINER:-supabase-db}
      # Manual weekly database backup (Админка → Бэкапы): where the dumps go
      # and how many of them to keep. Four weekly copies ≈ one month.
      UPDATE_BACKUP_DIR: ${UPDATE_BACKUP_DIR:-/opt/ed-ring-colony/backups}
      UPDATE_BACKUP_KEEP: ${UPDATE_BACKUP_KEEP:-4}
      BACKUP_TIMEOUT_MINUTES: ${BACKUP_TIMEOUT_MINUTES:-120}
    volumes:
      - ${PROJECT_HOST_DIR:-/opt/ed-ring-colony/src}:${PROJECT_HOST_DIR:-/opt/ed-ring-colony/src}
      - /var/run/docker.sock:/var/run/docker.sock
      - update-state:/state
      # The rootfs is read-only, so the dump needs an explicit writable path
      # on the host; the same path is where the operator finds the copies.
      - ${UPDATE_BACKUP_DIR:-/opt/ed-ring-colony/backups}:${UPDATE_BACKUP_DIR:-/opt/ed-ring-colony/backups}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Опционально: EDDN-воркер (ZeroMQ-подписка на рыночные данные).
  # На Vercel он не работал в принципе — на VPS можно включить.
  # Раскомментируйте и выполните `npm i zeromq` перед сборкой,
  # либо запускайте его отдельно через pm2/systemd (см. DEPLOY.md).
  # eddn-worker:
  #   build:
  #     context: .
  #     dockerfile: deploy/Dockerfile.eddn
  #   env_file:
  #     - .env.production
  #   environment:
  #     EDDN_INGEST_URL: http://web:3000/api/eddn/ingest
  #   depends_on:
  #     - web
  #   restart: unless-stopped

volumes:
  jobs-state:
  # Lock, progress state and the updater's own log.
  update-state:
  # On-disk Spansh dump archive for the in-app galaxy import.
  galaxy-dump:

networks:
  # Only web and monitor-agent join this network; it has no external route.
  monitor:
    internal: true
