# ED Ring Colony — docker compose для VPS
#
#   1. cp .env.example .env.production и заполните значения
#   2. docker compose --env-file .env.production up -d --build
#
# Веб-приложение слушает 127.0.0.1:3000 — наружу его отдаёт nginx/caddy
# (см. deploy/nginx.conf). Если reverse-proxy не нужен, поменяйте
# "127.0.0.1:3000:3000" на "3000:3000".

services:
  web:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* вшиваются в бандл на этапе сборки
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        # Private Kong address used to compile the same-origin Supabase gateway
        # in next.config.mjs. It is never exposed to browser JavaScript.
        SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        # Non-secret deployment metadata for the protected status dashboard.
        # The shell values below can be filled automatically before a deploy;
        # "unknown" is safe when a legacy deployment has no build metadata.
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_GIT_REF: ${APP_GIT_REF:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
        # 0 — пропустить npm test внутри образа (экстренный быстрый режим).
        RUN_TESTS: ${RUN_TESTS:-1}
    env_file:
      - .env.production
    environment:
      # The agent has no published port and is queried only after admin auth.
      MONITOR_AGENT_URL: http://monitor-agent:8080
      MONITOR_AGENT_TOKEN: ${MONITOR_AGENT_TOKEN:-}
      # Manual project update: the private update-agent (profile `monitoring`)
      # is the only process allowed to run git and Docker. `web` forwards an
      # admin-confirmed request to it with a separate Bearer token.
      # A non-Docker (systemd) install uses http://127.0.0.1:8092 instead.
      UPDATE_AGENT_URL: ${UPDATE_AGENT_URL:-http://update-agent:8092}
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:-}
      PROJECT_REPOSITORY: ${PROJECT_REPOSITORY:-NooboGreenD/ed-ring-colony}
      PROJECT_UPDATE_BRANCH: ${PROJECT_UPDATE_BRANCH:-main}
      PROJECT_DEPLOY_MODE: ${PROJECT_DEPLOY_MODE:-auto}
      # Пакеты обновлений Colonial Helper лежат на отдельном bind mount,
      # а не внутри образа: это обычные файлы, адресуемые по sha256, и
      # отдаются они тем же nginx. Внутри контейнера путь всегда /data/uploader;
      # на хосте по умолчанию это отдельная папка на диске с backup'ами.
      UPLOADER_STORE_DIR: ${UPLOADER_STORE_DIR:-/data/uploader}
    # Lets a host-run updater (deploy/ed-ring-colony-update.service) be reached
    # without publishing its port; harmless when the agent runs as a container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Дампы Spansh и их распакованные шарды: отдельный диск сервера
      # (/mnt/sdb по умолчанию), а не системный раздел и не слой образа.
      # Полный systems.json.gz — 5.9 ГиБ, его шарды — ещё столько же, сырой
      # systems.json был бы 32+ ГБ (поэтому шарды и хранятся сжатыми).
      # Скачивание возобновляемое, идёт в несколько HTTP Range-соединений,
      # у каждого варианта свой файл; предыдущий дамп удаляется перед
      # загрузкой нового, а архив — после успешного импорта
      # (GALAXY_ARCHIVE_KEEP=1 отключает). Слева — ПУТЬ монтирования диска,
      # а не устройство: /dev/sdb1 должен быть смонтирован (findmnt -no TARGET
      # /dev/sdb1). Настройка диска и перенос со старого named volume:
      # sudo bash deploy/migrate-galaxy-dump.sh. Путь внутри контейнера
      # меняется через GALAXY_ARCHIVE_DIR.
      - ${GALAXY_DATA_HOST_DIR:-/mnt/sdb/ed-ring-colony/spansh}:/app/data/spansh
      # Пакеты кода Colonial Helper: ВСЕ манифесты, blobs, ZIP, EXE,
      # config.json и журналы релизов лежат на хостовом диске с backup'ами,
      # в отдельной папке uploader-releases. Образы и docker prune эту историю
      # не затронут. При переносе со старой установки сначала выполните
      # deploy/migrate-uploader-store.sh.
      - ${UPLOADER_STORE_HOST_DIR:-/opt/ed-ring-colony/backups/uploader-releases}:${UPLOADER_STORE_DIR:-/data/uploader}
    # The private monitor network prevents the privileged agent from sharing
    # the default service network with other containers.
    networks:
      - default
      - monitor
    restart: unless-stopped
    # json-file без лимитов растёт без конца (у jobs/агентов лимиты уже были,
    # у web — нет): очередной источник «куда девается диск». Те же границы,
    # что у остальных сервисов стека.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # All six former Actions jobs, on the server. Exactly ONE scheduler instance.
  # No public ports; requests use the Docker network, bypassing public nginx/TLS.
  jobs:
    build:
      context: .
      dockerfile: deploy/Dockerfile.jobs
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env.production and pass --env-file .env.production}
      JOBS_BASE_URL: http://web:3000
      JOBS_STATE_FILE: /data/jobs-state.json
      # `galaxy-import` (ночное обновление каталога систем) не входит в список
      # по умолчанию: добавьте его в JOBS_ENABLED осознанно. Ночью задача
      # качает НЕ полный дамп (5.9 ГиБ), а дельту Spansh, перекрывающую
      # отставание каталога (systems_1week.json.gz, ~21 МиБ) — полный нужен
      # один раз при холодном старте. Подробности и альтернативы: SPANSH-IMPORT.md.
      JOBS_ENABLED: ${JOBS_ENABLED-capi-sync,update-progress,cg-check,eddn-cleanup,colonisation-cleanup,galnet-sync,translate}
      GALNET_FEED_LIMIT: ${GALNET_FEED_LIMIT:-30}
      GALNET_TRANSLATE_LIMIT: ${GALNET_TRANSLATE_LIMIT:-10}
      JOBS_TRANSLATE_PASSES: ${JOBS_TRANSLATE_PASSES:-4}
    volumes:
      - jobs-state:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Private read-only operations agent. It is the *only* service that sees
  # Docker's Unix socket; `web` gets a sanitised status response over the
  # internal Compose network after application-level admin authorization.
  # No host port is published. Leave MONITOR_AGENT_TOKEN empty only when the
  # dashboard is intentionally disabled; the public site keeps working.
  monitor-agent:
    # Opt-in because Docker's socket is privileged even when mounted :ro.
    # Start it with: docker compose --profile monitoring up -d monitor-agent
    profiles: ["monitoring"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.monitor
    environment:
      MONITOR_AGENT_TOKEN: ${MONITOR_AGENT_TOKEN:-}
      # Usually inferred from this container's Compose label; this is a
      # fallback for installations with a custom container hostname.
      MONITOR_COMPOSE_PROJECT: ${MONITOR_COMPOSE_PROJECT:-ed-ring-colony}
      MONITOR_SERVICES: web,jobs,monitor-agent
      # Preserve JOBS_ENABLED semantics: a missing value uses the normal list,
      # an explicitly empty value means no scheduler tasks are enabled.
      MONITOR_JOBS_ENABLED: ${JOBS_ENABLED-capi-sync,update-progress,cg-check,eddn-cleanup,colonisation-cleanup,galnet-sync,translate}
      MONITOR_JOBS_STATE_FILE: /monitor/jobs-state/jobs-state.json
      # Опциональный прямой read-only замер размера БД (pg_database_size).
      # Зеркалируется из DATABASE_URL/SUPABASE_DB_URL скриптом start-monitoring.sh:
      # web-контейнер не всегда видит Postgres напрямую, а агент — да.
      MONITOR_DB_URL: ${MONITOR_DB_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - jobs-state:/monitor/jobs-state:ro
    networks:
      - monitor
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Privileged by design: the only container allowed to change what runs.
  # It gets the Docker socket (read-write: it recreates services) and the repo
  # mounted at the SAME host path, because the daemon resolves build contexts
  # on the host. Never published on a host port; reachable only from the
  # Compose network and only with UPDATE_AGENT_TOKEN.
  update-agent:
    profiles: ["monitoring"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.update-agent
    environment:
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:-}
      UPDATE_AGENT_PORT: 8092
      PROJECT_DIR: ${PROJECT_HOST_DIR:-/opt/ed-ring-colony/src}
      PROJECT_REPOSITORY: ${PROJECT_REPOSITORY:-NooboGreenD/ed-ring-colony}
      PROJECT_UPDATE_BRANCH: ${PROJECT_UPDATE_BRANCH:-main}
      PROJECT_DEPLOY_MODE: ${PROJECT_DEPLOY_MODE-compose}
      UPDATE_APPLY_MIGRATIONS: ${UPDATE_APPLY_MIGRATIONS:-1}
      # Keep the BuildKit cache budget in the agent environment. Without this
      # explicit pass-through, a value in .env.production never reaches the
      # host-side cleanup helper and failed --no-cache builds can accumulate.
      UPDATE_DOCKER_CACHE_KEEP: ${UPDATE_DOCKER_CACHE_KEEP:-8g}
      # Provenance-аттестации по умолчанию выключены: их запись — лишний
      # сетевой вызов в Docker Hub в конце сборки («resolving provenance for
      # metadata file»), и на нестабильном канале он ронял весь compose build
      # строкой «DeadlineExceeded: context deadline exceeded» уже после
      # собранных образов. Скрипты экспортируют переменную и сами; проброс
      # нужен, чтобы значением 0 в .env.production можно было вернуть
      # аттестации — иначе до контейнера агента оно не доходит.
      BUILDX_NO_DEFAULT_ATTESTATIONS: ${BUILDX_NO_DEFAULT_ATTESTATIONS:-1}
      # 0 disables only the automatic post-update restart. The explicit
      # admin-panel button remains available in either mode.
      UPDATE_AGENT_SELF_RESTART: ${UPDATE_AGENT_SELF_RESTART:-1}
      UPDATE_AGENT_RESTART_DELAY_SECONDS: ${UPDATE_AGENT_RESTART_DELAY_SECONDS:-12}
      UPDATE_STATE_DIR: /state
      UPDATE_HEALTH_URL: http://web:3000/api/health
      # Docker CLI пишет конфиг в $HOME/.docker, а rootfs агента read-only:
      # BuildKit-сборка падала на «mkdir /root/.docker: read-only file system»
      # сразу после того, как в образе появился плагин buildx (legacy-билдер
      # конфиг не трогал, поэтому раньше проблема не проявлялась). Каталог
      # переносим на том update-state: он записываемый и переживает
      # пересоздание контейнера, так что состояние buildx не теряется.
      DOCKER_CONFIG: /state/.docker
      # pg_dump/pg_restore inside the updater talk to the self-hosted stack.
      SUPABASE_CONTAINER: ${SUPABASE_CONTAINER:-supabase-db}
      # Сторож сети Supabase: раз в минуту агент проверяет, что web и
      # monitor-agent подключены к docker-сети, где контейнер supabase-db
      # публикует alias `db`, и переподключает отвалившиеся контейнеры на
      # лету (`docker network connect`, без пересоздания). Это страховка от
      # ЛЮБОГО `docker compose up` без deploy/compose.supabase-net.yml
      # (другой каталог, старый скрипт, ручная команда): раньше такой up
      # молча отцеплял web от сети, и «Проверить подключение к БД» снова
      # показывал «имя db не резолвится» до следующего start-monitoring.sh.
      # Каждый ремонт попадает в журнал агента вместе с compose-проектом
      # контейнера — по нему видно, откуда пришёл «чужой» up.
      # 0 — выключить; SUPABASE_NETWORK — подсказка на случай, когда
      # supabase-db в момент проверки перезапускается.
      SUPABASE_NETWORK: ${SUPABASE_NETWORK:-}
      SUPABASE_NET_WATCH_SECONDS: ${SUPABASE_NET_WATCH_SECONDS:-60}
      SUPABASE_NET_WATCH_SERVICES: ${SUPABASE_NET_WATCH_SERVICES:-web,monitor-agent}
      # Manual weekly database backup (Админка → Бэкапы): where the dumps go
      # and how many of them to keep. Four weekly copies ≈ one month.
      UPDATE_BACKUP_DIR: ${UPDATE_BACKUP_DIR:-/opt/ed-ring-colony/backups}
      UPDATE_BACKUP_KEEP: ${UPDATE_BACKUP_KEEP:-4}
      BACKUP_TIMEOUT_MINUTES: ${BACKUP_TIMEOUT_MINUTES:-120}
      # Mail settings from Админка → Авторизация: the GoTrue (auth) container
      # reads SMTP from the SUPABASE stack's env, not this compose file. The
      # agent edits /opt/supabase/.env and recreates `auth` through the socket;
      # the directory is mounted at the SAME host path (same reason as PROJECT_DIR).
      SUPABASE_HOST_DIR: ${SUPABASE_HOST_DIR:-/opt/supabase}
    volumes:
      - ${PROJECT_HOST_DIR:-/opt/ed-ring-colony/src}:${PROJECT_HOST_DIR:-/opt/ed-ring-colony/src}
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SUPABASE_HOST_DIR:-/opt/supabase}:${SUPABASE_HOST_DIR:-/opt/supabase}
      - update-state:/state
      # The rootfs is read-only, so the dump needs an explicit writable path
      # on the host; the same path is where the operator finds the copies.
      - ${UPDATE_BACKUP_DIR:-/opt/ed-ring-colony/backups}:${UPDATE_BACKUP_DIR:-/opt/ed-ring-colony/backups}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Опционально: EDDN-воркер (ZeroMQ-подписка на рыночные данные).
  # На Vercel он не работал в принципе — на VPS можно включить.
  # Раскомментируйте и выполните `npm i zeromq` перед сборкой,
  # либо запускайте его отдельно через pm2/systemd (см. DEPLOY.md).
  # eddn-worker:
  #   build:
  #     context: .
  #     dockerfile: deploy/Dockerfile.eddn
  #   env_file:
  #     - .env.production
  #   environment:
  #     EDDN_INGEST_URL: http://web:3000/api/eddn/ingest
  #   depends_on:
  #     - web
  #   restart: unless-stopped

volumes:
  jobs-state:
  # Lock, progress state and the updater's own log.
  update-state:
  # Старый named volume с дампами Spansh. web его больше не монтирует:
  # архивы и шарды живут на отдельном диске (bind mount GALAXY_DATA_HOST_DIR).
  # Не удаляйте том до переноса — deploy/migrate-galaxy-dump.sh.
  galaxy-dump:
  # Старый named volume оставлен только для безопасной миграции существующих
  # установок. web больше его не монтирует: рабочее хранилище — bind mount
  # UPLOADER_STORE_HOST_DIR выше. Не удаляйте этот volume до миграции.
  uploader-store:

networks:
  # Only web and monitor-agent join this network; it has no external route.
  monitor:
    internal: true
